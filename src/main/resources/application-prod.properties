# ============================================
# PRODUCTION CONFIGURATION
# ============================================

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Spring Application Name
spring.application.name=content-analytics-backend
spring.profiles.active=prod

# ============================================
# DATABASE - PRODUCTION (Environment Variables)
# ============================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool - Production (Higher capacity)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Flyway Configuration (database migrations)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ============================================
# REDIS - PRODUCTION (Environment Variables)
# ============================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=60000ms
spring.data.redis.jedis.pool.max-active=20
spring.data.redis.jedis.pool.max-idle=10
spring.data.redis.jedis.pool.min-idle=5
spring.data.redis.jedis.pool.max-wait=2000ms
spring.data.redis.ssl=${REDIS_SSL:true}

# ============================================
# JWT Configuration - PRODUCTION
# ============================================
# CRITICAL: Must be set via environment variable in production
# Minimum 32 characters, use strong random string
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=900000
app.jwt.refresh.expiration=604800000

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Custom Upload Configuration
app.max-upload-size=52428800
app.allowed-file-types=pdf,txt,docx,pptx

# ============================================
# Storage Configuration - PRODUCTION (S3)
# ============================================
app.storage.type=s3
app.storage.s3.enabled=true
app.storage.s3.bucket-name=${AWS_S3_BUCKET_NAME}
app.storage.s3.region=${AWS_REGION:us-east-1}
app.storage.s3.access-key=${AWS_ACCESS_KEY_ID}
app.storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
app.storage.s3.endpoint=${AWS_S3_ENDPOINT:}
app.storage.s3.force-path-style=false

# ============================================
# Logging Configuration - PRODUCTION (Warnings)
# ============================================
logging.level.root=WARN
logging.level.com.contentanalytics=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Logging to file
logging.file.name=/var/log/content-analytics/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# Actuator (Monitoring/Health) - PRODUCTION
# ============================================
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# ============================================
# Jackson Configuration
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================
# Error Handling - PRODUCTION
# ============================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ============================================
# CORS Configuration - PRODUCTION
# ============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-CSRF-Token
app.cors.allow-credentials=true
app.cors.max-age=3600

# ============================================
# Anthropic API Configuration - PRODUCTION
# ============================================
app.anthropic.api-key=${ANTHROPIC_API_KEY}
app.anthropic.api-url=https://api.anthropic.com/v1
app.anthropic.model=claude-3-5-sonnet-20241022
app.anthropic.max-tokens=2048
app.anthropic.timeout=60

# ============================================
# Async Configuration - PRODUCTION
# ============================================
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=content-analytics-async-

spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=content-analytics-scheduler-

# ============================================
# Security Configuration - PRODUCTION
# ============================================
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.compression.enabled=true
server.compression.min-response-size=1024

# ============================================
# Misc Configuration
# ============================================
app.name=Content Analytics Platform
app.version=1.0.0
app.description=Production-ready AI-powered content analytics backend